name: Feature request
description: Suggest something Common Browser should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work, including keys or config if you have an idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
