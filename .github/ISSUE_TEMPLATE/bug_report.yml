name: Bug report
description: Something works differently from how it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `common --version`, or the commit you built.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant part of common.toml
      render: toml
