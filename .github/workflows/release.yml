name: Release

# A `v*` tag publishes the app: the full check, then the packaged zip and its checksum attached to
# a GitHub release. Tags with a hyphen, such as v0.1.0-rc.1, are marked as prereleases.
#
# Pull requests that change how the app is packaged run the same packaging without publishing, so
# a broken package is found before a tag is.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/task
      - rust-toolchain.toml
      - apps/macos/Package.swift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: github.event_name == 'push'
        run: scripts/task check
      - id: package
        run: |
          zip=$(scripts/task package | tail -n 1)
          (cd "$(dirname "$zip")" && shasum -a 256 "$(basename "$zip")" >"$(basename "$zip").sha256")
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: common-browser-macos
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease=yes ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            ${prerelease:+--prerelease} "$ZIP" "$ZIP.sha256"
