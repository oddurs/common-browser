name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The macOS shell needs AppKit and WebKit, so the one check job runs on macOS.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/task check

  # The core serves the Linux and Windows shells too; testing it there keeps macOS assumptions such
  # as path syntax out of it.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/task check:core

  windows:
    runs-on: windows-latest
    defaults:
      run:
        # scripts/task is POSIX sh; Git Bash runs it.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/task check:core

  # The single status check that branch protection requires.
  required:
    if: always()
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.linux.result }}" = success
          test "${{ needs.windows.result }}" = success
